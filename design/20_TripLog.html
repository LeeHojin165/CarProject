<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>출장지 도착 운행기록</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#002C5F}a:hover{color:#001E42}
button:focus-visible{outline:4px solid #002C5F;outline-offset:4px}
::selection{background:#002C5F;color:#FFFFFF}
</style>

</head>
<body>


<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 64px 96px 80px; display: flex; flex-direction: column; gap: 48px; background: #F6F3F2; color: #1A1A1A; font-family: 'Asta Sans', 'Noto Sans KR', system-ui, sans-serif">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-size: 30px; font-weight: 700; letter-spacing: -0.01em">[앱 이름]</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 28px; border-radius: 999px; background: #FFFFFF; color: #5C5955; font-size: 28px; font-weight: 600">
<svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="M10 16V8h3a2.500 2.500 0 0 1 0 5h-3"></path></svg>
<span>주차 중 · 출장지 도착</span>
</div>
</div>
<div style="flex-grow: 1; display: flex; gap: 72px; align-items: stretch">
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 40px">
<h1 style="margin: 0; font-size: 84px; line-height: 1.24; font-weight: 800; letter-spacing: -0.03em">운행기록을 채웠어요.<br>목적은 <span style="color: #002C5F">고객사 미팅</span>이<br>맞나요?</h1>
<p style="margin: 0; font-size: 34px; line-height: 1.5; color: #5C5955">오늘 일정에 있는 미팅으로 짐작했어요. 다르면 말로 알려주세요.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 16px">
<button type="button" style="height: 144px; border: 0; border-radius: 36px; background: #002C5F; color: #FFFFFF; font-family: inherit; font-size: 46px; font-weight: 700; letter-spacing: -0.01em; cursor: pointer">맞아요, 저장</button>
<button type="button" style="height: 144px; border: 0; border-radius: 36px; background: #E2DFDB; color: #1A1A1A; font-family: inherit; font-size: 40px; font-weight: 600; cursor: pointer">목적 바꾸기</button>
</div>
</div>
<div style="width: 760px; flex-shrink: 0; box-sizing: border-box; padding: 40px 48px; border-radius: 44px; background: #FFFFFF; display: flex; flex-direction: column">
<h2 style="margin: 0 0 4px; font-size: 34px; font-weight: 700; letter-spacing: -0.01em">업무용승용차 운행기록</h2>
<div style="margin-bottom: 12px; font-size: 24px; color: #5C5955">국가법령정보센터 별지 서식 항목 기준</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0; border-top: 1px solid #E2DFDB">
<div style="font-size: 28px; color: #5C5955">사용일자</div>
<div style="font-size: 30px; font-weight: 700">11월 17일 (월)</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0; border-top: 1px solid #E2DFDB">
<div style="font-size: 28px; color: #5C5955">사용자</div>
<div style="font-size: 30px; font-weight: 700">[부서] · [이름]</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0; border-top: 1px solid #E2DFDB">
<div style="font-size: 28px; color: #5C5955">주행 전 계기판</div>
<div style="font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums">32,418km</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0; border-top: 1px solid #E2DFDB">
<div style="font-size: 28px; color: #5C5955">주행 후 계기판</div>
<div style="font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums">32,461km</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0; border-top: 1px solid #E2DFDB">
<div style="font-size: 28px; color: #5C5955">주행거리 · 일반 업무용</div>
<div style="font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums">43km</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0; border-top: 1px solid #E2DFDB">
<div style="font-size: 28px; color: #5C5955">비고 (운행 목적)</div>
<div style="font-size: 30px; font-weight: 700; color: #002C5F">고객사 미팅 · 확인 대기</div>
</div>
<div style="margin-top: auto; padding: 26px 32px; border-radius: 28px; background: #E2DFDB; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font-size: 30px; font-weight: 700">이번 주행 유류비</div>
<div style="font-size: 44px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">약 6,100원</div>
</div>
<div style="font-size: 24px; line-height: 1.5; color: #5C5955; font-variant-numeric: tabular-nums">43km ÷ 평균 연비 12.0km/L × [지역 평균 유가] 1,700원/L</div>
</div>
</div>
</div>
</div>


</body>
</html>
