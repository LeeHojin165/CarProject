<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>픽업하는 동안 공조 유지</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#00AAD2}a:hover{color:#AACAE6}
button:focus-visible{outline:4px solid #00AAD2;outline-offset:4px}
::selection{background:#002C5F;color:#FFFFFF}
</style>

</head>
<body>


<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 64px 96px 80px; display: flex; flex-direction: column; gap: 48px; background: #0A0F17; color: #F6F3F2; font-family: 'Asta Sans', 'Noto Sans KR', system-ui, sans-serif">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-size: 30px; font-weight: 700; letter-spacing: -0.01em">[앱 이름]</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 28px; border-radius: 999px; background: #121A26; color: #A7B0BD; font-size: 28px; font-weight: 600">
<svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="M10 16V8h3a2.500 2.500 0 0 1 0 5h-3"></path></svg>
<span>주차 중 · 픽업 가게 앞</span>
</div>
</div>
<div style="flex-grow: 1; display: flex; gap: 80px; align-items: stretch">
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 40px">
<h1 style="margin: 0; font-size: 92px; line-height: 1.22; font-weight: 800; letter-spacing: -0.03em">다녀오는 동안<br>히터를 켜 둘까요?</h1>
<p style="margin: 0; font-size: 34px; line-height: 1.5; color: #A7B0BD">바깥은 <span style="color: #F6F3F2; font-weight: 700">3도</span>예요. 돌아왔을 때 차 안을 <span style="color: #F6F3F2; font-weight: 700">22도</span>로 맞춰 둘게요.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 16px">
<button type="button" style="height: 144px; border: 0; border-radius: 36px; background: #AACAE6; color: #002C5F; font-family: inherit; font-size: 46px; font-weight: 700; letter-spacing: -0.01em; cursor: pointer">켜 둘게요</button>
<button type="button" style="height: 144px; border: 0; border-radius: 36px; background: #1C2636; color: #F6F3F2; font-family: inherit; font-size: 40px; font-weight: 600; cursor: pointer">괜찮아요</button>
</div>
</div>
<div style="width: 660px; flex-shrink: 0; box-sizing: border-box; padding: 44px 48px; border-radius: 44px; background: #121A26; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0 0 12px; font-size: 36px; font-weight: 700; letter-spacing: -0.01em">켜 두면 이렇게 할게요</h2>
<div style="display: flex; align-items: center; gap: 24px; padding: 26px 0">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#A7B0BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13.500V5a2 2 0 0 1 4 0v8.500a4 4 0 1 1-4 0z"></path></svg>
<div style="flex-grow: 1; font-size: 32px; color: #A7B0BD">실내 온도</div>
<div style="font-size: 34px; font-weight: 700">22도 유지</div>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 26px 0; border-top: 1px solid #2A3546">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#A7B0BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-6a3 3 0 0 1 3-3h5l4 4v5"></path><path d="M9 4c-1 1.300 1 2.200 0 3.500M13 4c-1 1.300 1 2.200 0 3.500"></path></svg>
<div style="flex-grow: 1; font-size: 32px; color: #A7B0BD">운전석 열선</div>
<div style="font-size: 34px; font-weight: 700">2단 유지</div>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 26px 0; border-top: 1px solid #2A3546">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#A7B0BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="16" height="9" rx="2.500"></rect><path d="M22 11v3"></path><path d="M7 11.500v2M10.500 11.500v2"></path></svg>
<div style="flex-grow: 1; font-size: 32px; color: #A7B0BD">배터리</div>
<div style="font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums">54% → 약 [n]% 사용</div>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 26px 0; border-top: 1px solid #2A3546">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#A7B0BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.500" width="14" height="10" rx="2.500"></rect><path d="M8 10.500V7.500a4 4 0 0 1 8 0v3"></path></svg>
<div style="flex-grow: 1; font-size: 32px; color: #A7B0BD">문</div>
<div style="font-size: 34px; font-weight: 700">내리면 잠가 둘게요</div>
</div>
<div style="margin-top: auto; padding: 28px 32px; border-radius: 28px; background: #1C2636; display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 26px; color: #A7B0BD">픽업 번호</div>
<div style="font-size: 52px; font-weight: 800; letter-spacing: 0.04em; font-variant-numeric: tabular-nums">1234</div>
</div>
<div style="font-size: 28px; color: #A7B0BD; text-align: right; line-height: 1.5">폰으로도 보냈어요<br>20:00까지 픽업</div>
</div>
</div>
</div>
</div>


</body>
</html>
