<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회사 도착 후 내리기 전 확인</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#002C5F}a:hover{color:#001E42}
button:focus-visible{outline:4px solid #002C5F;outline-offset:4px}
::selection{background:#002C5F;color:#FFFFFF}
</style>

</head>
<body>


<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 64px 96px 80px; display: flex; flex-direction: column; gap: 48px; background: #F6F3F2; color: #1A1A1A; font-family: 'Asta Sans', 'Noto Sans KR', system-ui, sans-serif">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-size: 30px; font-weight: 700; letter-spacing: -0.01em">[앱 이름]</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 28px; border-radius: 999px; background: #FFFFFF; color: #5C5955; font-size: 28px; font-weight: 600">
<svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="M10 16V8h3a2.500 2.500 0 0 1 0 5h-3"></path></svg>
<span>주차 중 · 회사 도착</span>
</div>
</div>
<div style="flex-grow: 1; display: flex; gap: 80px; align-items: stretch">
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 40px">
<h1 style="margin: 0; font-size: 92px; line-height: 1.22; font-weight: 800; letter-spacing: -0.03em">조수석 창문이<br>열려 있어요. 닫을까요?</h1>
<p style="margin: 0; font-size: 34px; line-height: 1.5; color: #5C5955">나머지는 모두 확인했어요. 9시 회의까지 12분 남았어요.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 16px">
<button type="button" style="height: 144px; border: 0; border-radius: 36px; background: #002C5F; color: #FFFFFF; font-family: inherit; font-size: 46px; font-weight: 700; letter-spacing: -0.01em; cursor: pointer">창문 닫기</button>
<button type="button" style="height: 144px; border: 0; border-radius: 36px; background: #E2DFDB; color: #1A1A1A; font-family: inherit; font-size: 40px; font-weight: 600; cursor: pointer">그대로 둘게요</button>
</div>
</div>
<div style="width: 660px; flex-shrink: 0; box-sizing: border-box; padding: 44px 48px; border-radius: 44px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0 0 12px; font-size: 36px; font-weight: 700; letter-spacing: -0.01em">내리기 전에 살펴봤어요</h2>
<div style="display: flex; align-items: center; gap: 24px; padding: 26px 0">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#A36B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18V11l5-6h9a2 2 0 0 1 2 2v11H4z"></path><path d="M4 12h16"></path></svg>
<div style="flex-grow: 1; font-size: 32px; color: #5C5955">창문</div>
<div style="font-size: 34px; font-weight: 700; color: #A36B4F">조수석 열림</div>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 26px 0; border-top: 1px solid #E2DFDB">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#5C5955" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.500" width="14" height="10" rx="2.500"></rect><path d="M8 10.500V7.500a4 4 0 0 1 8 0v3"></path></svg>
<div style="flex-grow: 1; font-size: 32px; color: #5C5955">문</div>
<div style="font-size: 34px; font-weight: 700">모두 닫힘</div>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 26px 0; border-top: 1px solid #E2DFDB">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#5C5955" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.500 10.900c.600.500 1 1.200 1 2.100h5c0-.900.400-1.600 1-2.100A6 6 0 0 0 12 3z"></path></svg>
<div style="flex-grow: 1; font-size: 32px; color: #5C5955">조명</div>
<div style="font-size: 34px; font-weight: 700">모두 꺼짐</div>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 26px 0; border-top: 1px solid #E2DFDB">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#5C5955" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.500h16v11H9.500L5 20v-3.500H4v-11z"></path></svg>
<div style="flex-grow: 1; font-size: 32px; color: #5C5955">Slack 상태</div>
<div style="font-size: 34px; font-weight: 700">"이동 중" 해제</div>
</div>
<div style="margin-top: auto; padding: 28px 32px; border-radius: 28px; background: #E2DFDB; display: flex; justify-content: space-between; align-items: baseline">
<div style="font-size: 30px; color: #5C5955">오늘 출근길</div>
<div style="font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums">18.4km · 41분</div>
</div>
</div>
</div>
</div>


</body>
</html>
