<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>출장 출발</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#002C5F}a:hover{color:#001E42}
button:focus-visible{outline:4px solid #002C5F;outline-offset:4px}
::selection{background:#002C5F;color:#FFFFFF}
</style>

</head>
<body>


<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 64px 96px 80px; display: flex; flex-direction: column; gap: 48px; background: #F6F3F2; color: #1A1A1A; font-family: 'Asta Sans', 'Noto Sans KR', system-ui, sans-serif">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-size: 30px; font-weight: 700; letter-spacing: -0.01em">[앱 이름]</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 28px; border-radius: 999px; background: #FFFFFF; color: #5C5955; font-size: 28px; font-weight: 600">
<svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="M10 16V8h3a2.500 2.500 0 0 1 0 5h-3"></path></svg>
<span>주차 중 · 출장 준비</span>
</div>
</div>
<div style="flex-grow: 1; display: flex; gap: 80px; align-items: stretch">
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 40px">
<h1 style="margin: 0; font-size: 92px; line-height: 1.22; font-weight: 800; letter-spacing: -0.03em">고객사까지 52분.<br><span style="color: #002C5F">11시 08분</span>에 도착해요.</h1>
<p style="margin: 0; font-size: 34px; line-height: 1.5; color: #5C5955">11시 30분 미팅까지 <span style="color: #1A1A1A; font-weight: 700">22분 여유</span>가 있어요. 법인 차량이라 운행기록은 알아서 남길게요.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 16px">
<button type="button" style="height: 144px; border: 0; border-radius: 36px; background: #002C5F; color: #FFFFFF; font-family: inherit; font-size: 46px; font-weight: 700; letter-spacing: -0.01em; cursor: pointer">출발할게요</button>
<button type="button" style="height: 144px; border: 0; border-radius: 36px; background: #E2DFDB; color: #1A1A1A; font-family: inherit; font-size: 40px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 18px">
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.500v5h3.500L12 18.500v-13L7.500 9.500H4z"></path><path d="M16 9a4.500 4.500 0 0 1 0 6M18.800 6.500a8 8 0 0 1 0 11"></path></svg>
<span>할 일 읽어줘</span>
</button>
</div>
</div>
<div style="width: 660px; flex-shrink: 0; box-sizing: border-box; padding: 44px 48px; border-radius: 44px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 36px; font-weight: 700; letter-spacing: -0.01em">가서 할 일</h2>
<div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 28px; color: #5C5955">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.500-5.600-6.500-11a6.500 6.500 0 0 1 13 0c0 5.400-6.500 11-6.500 11z"></path><circle cx="12" cy="10" r="2.300"></circle></svg>
<span>11:30 고객사 미팅 · [미팅 장소]</span>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 26px 0; border-top: 1px solid #E2DFDB">
<div style="width: 36px; height: 36px; flex-shrink: 0; box-sizing: border-box; border: 3px solid #C6C2BD; border-radius: 10px"></div>
<div style="font-size: 32px; line-height: 1.4">제안서 최종본 공유</div>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 26px 0; border-top: 1px solid #E2DFDB">
<div style="width: 36px; height: 36px; flex-shrink: 0; box-sizing: border-box; border: 3px solid #C6C2BD; border-radius: 10px"></div>
<div style="font-size: 32px; line-height: 1.4">견적 일정 확인</div>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 26px 0; border-top: 1px solid #E2DFDB">
<div style="width: 36px; height: 36px; flex-shrink: 0; box-sizing: border-box; border: 3px solid #C6C2BD; border-radius: 10px"></div>
<div style="font-size: 32px; line-height: 1.4">다음 미팅 날짜 잡기</div>
</div>
<div style="margin-top: auto; padding: 28px 32px; border-radius: 28px; background: #E2DFDB; display: flex; align-items: center; gap: 24px">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#002C5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.500" width="14" height="17" rx="2.500"></rect><path d="M9 8.500h6M9 12h6M9 15.500h3.500"></path></svg>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 32px; font-weight: 700">운행기록 시작했어요</div>
<div style="font-size: 28px; color: #5C5955; font-variant-numeric: tabular-nums">출발 계기판 32,418km</div>
</div>
</div>
</div>
</div>
</div>


</body>
</html>
