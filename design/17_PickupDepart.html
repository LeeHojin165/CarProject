<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>픽업 후 출발 환기</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#00AAD2}a:hover{color:#AACAE6}
button:focus-visible{outline:4px solid #00AAD2;outline-offset:4px}
::selection{background:#002C5F;color:#FFFFFF}
</style>

</head>
<body>


<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 64px 96px 80px; display: flex; flex-direction: column; gap: 48px; background: #0A0F17; color: #F6F3F2; font-family: 'Asta Sans', 'Noto Sans KR', system-ui, sans-serif">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-size: 30px; font-weight: 700; letter-spacing: -0.01em">[앱 이름]</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 28px; border-radius: 999px; background: #121A26; color: #A7B0BD; font-size: 28px; font-weight: 600">
<svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="M10 16V8h3a2.500 2.500 0 0 1 0 5h-3"></path></svg>
<span>주차 중 · 픽업 완료</span>
</div>
</div>
<div style="flex-grow: 1; display: flex; gap: 80px; align-items: stretch">
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 40px">
<h1 style="margin: 0; font-size: 92px; line-height: 1.22; font-weight: 800; letter-spacing: -0.03em">음식 냄새가 배지 않게<br>1분만 환기할까요?</h1>
<p style="margin: 0; font-size: 34px; line-height: 1.5; color: #A7B0BD">창문을 조금만 열었다가, 1분 뒤에 다시 닫을게요.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 16px">
<button type="button" style="height: 144px; border: 0; border-radius: 36px; background: #AACAE6; color: #002C5F; font-family: inherit; font-size: 46px; font-weight: 700; letter-spacing: -0.01em; cursor: pointer">환기할게요</button>
<button type="button" style="height: 144px; border: 0; border-radius: 36px; background: #1C2636; color: #F6F3F2; font-family: inherit; font-size: 40px; font-weight: 600; cursor: pointer">괜찮아요</button>
</div>
</div>
<div style="width: 660px; flex-shrink: 0; box-sizing: border-box; padding: 44px 48px; border-radius: 44px; background: #121A26; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0 0 12px; font-size: 36px; font-weight: 700; letter-spacing: -0.01em">환기하면 이렇게 할게요</h2>
<div style="display: flex; align-items: center; gap: 24px; padding: 26px 0">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#A7B0BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18V11l5-6h9a2 2 0 0 1 2 2v11H4z"></path><path d="M4 12h16"></path></svg>
<div style="flex-grow: 1; font-size: 32px; color: #A7B0BD">창문</div>
<div style="font-size: 34px; font-weight: 700">앞좌석 조금 열기</div>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 26px 0; border-top: 1px solid #2A3546">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#A7B0BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.500 2M10 2h4"></path></svg>
<div style="flex-grow: 1; font-size: 32px; color: #A7B0BD">시간</div>
<div style="font-size: 34px; font-weight: 700">1분 뒤 자동으로 닫힘</div>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 26px 0; border-top: 1px solid #2A3546">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#A7B0BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13.500V5a2 2 0 0 1 4 0v8.500a4 4 0 1 1-4 0z"></path></svg>
<div style="flex-grow: 1; font-size: 32px; color: #A7B0BD">히터</div>
<div style="font-size: 34px; font-weight: 700">계속 22도</div>
</div>
<div style="margin-top: auto; padding: 28px 32px; border-radius: 28px; background: #1C2636; display: flex; align-items: center; gap: 24px">
<svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#00AAD2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-8"></path><path d="M12 13c0-4 2.500-7 7-7 0 4.500-3 7-7 7z"></path><path d="M12 15c0-3-2-5.500-6-5.500 0 3.500 2.500 5.500 6 5.500z"></path></svg>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums">오늘 음식 1.2kg을 구했어요</div>
<div style="font-size: 26px; color: #A7B0BD">버려질 뻔한 음식을 기록해 뒀어요</div>
</div>
</div>
</div>
</div>
</div>


</body>
</html>
