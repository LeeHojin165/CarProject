<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>처음 실행 QR 로그인</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#002C5F}a:hover{color:#001E42}
button:focus-visible{outline:4px solid #002C5F;outline-offset:4px}
::selection{background:#002C5F;color:#FFFFFF}
</style>

</head>
<body>


<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 64px 96px 80px; display: flex; flex-direction: column; gap: 48px; background: #F6F3F2; color: #1A1A1A; font-family: 'Asta Sans', 'Noto Sans KR', system-ui, sans-serif">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-size: 30px; font-weight: 700; letter-spacing: -0.01em">[앱 이름]</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 28px; border-radius: 999px; background: #FFFFFF; color: #5C5955; font-size: 28px; font-weight: 600">
<svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4.500 20.500a7.500 7.500 0 0 1 15 0"></path></svg>
<span>[프로필 이름] 프로필 · 주차 중</span>
</div>
</div>
<div style="flex-grow: 1; display: flex; gap: 80px; align-items: stretch">
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 36px">
<h1 style="margin: 0; font-size: 76px; line-height: 1.22; font-weight: 800; letter-spacing: -0.03em">처음 오셨네요.<br>휴대폰으로 <span style="color: #002C5F">QR을 찍어</span><br>연결해 주세요.</h1>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 28px; padding: 18px 0">
<div style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 999px; background: #002C5F; color: #FFFFFF; font-size: 28px; font-weight: 800; display: flex; align-items: center; justify-content: center">1</div>
<div style="font-size: 36px; font-weight: 600">휴대폰 카메라로 QR 찍기</div>
</div>
<div style="display: flex; align-items: center; gap: 28px; padding: 18px 0; border-top: 1px solid #E2DFDB">
<div style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 999px; background: #E2DFDB; color: #1A1A1A; font-size: 28px; font-weight: 800; display: flex; align-items: center; justify-content: center">2</div>
<div style="font-size: 36px; font-weight: 600">휴대폰에서 구글 계정으로 로그인</div>
</div>
<div style="display: flex; align-items: center; gap: 28px; padding: 18px 0; border-top: 1px solid #E2DFDB">
<div style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 999px; background: #E2DFDB; color: #1A1A1A; font-size: 28px; font-weight: 800; display: flex; align-items: center; justify-content: center">3</div>
<div style="font-size: 36px; font-weight: 600">Slack 연결하기</div>
</div>
</div>
<div style="display: flex; align-items: flex-start; gap: 16px; font-size: 30px; line-height: 1.5; color: #5C5955">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 4px"><rect x="5" y="10.500" width="14" height="10" rx="2.500"></rect><path d="M8 10.500V7.500a4 4 0 0 1 8 0v3"></path></svg>
<span>한 번만 하면 돼요. 연결 정보는 이 차의 [프로필 이름] 프로필에만 저장되고, 다른 프로필에서는 보이지 않아요.</span>
</div>
</div>
<div style="width: 680px; flex-shrink: 0; box-sizing: border-box; padding: 48px; border-radius: 44px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 22px">
<div role="img" aria-label="로그인용 QR 코드 자리" style="width: 360px; height: 360px; box-sizing: border-box; padding: 24px; border-radius: 28px; border: 2px solid #E2DFDB; position: relative">
<div style="position: absolute; left: 24px; top: 24px; width: 104px; height: 104px; box-sizing: border-box; border: 16px solid #1A1A1A; border-radius: 14px"></div>
<div style="position: absolute; right: 24px; top: 24px; width: 104px; height: 104px; box-sizing: border-box; border: 16px solid #1A1A1A; border-radius: 14px"></div>
<div style="position: absolute; left: 24px; bottom: 24px; width: 104px; height: 104px; box-sizing: border-box; border: 16px solid #1A1A1A; border-radius: 14px"></div>
<div style="position: absolute; left: 130px; top: 130px; width: 100px; height: 100px; border-radius: 16px; background: #F6F3F2; color: #5C5955; font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center">[QR]</div>
</div>
<div style="display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 600; color: #002C5F">
<svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18V8a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v10"></path><path d="M3 18h18"></path><path d="M10 15h4"></path></svg>
<span>휴대폰에서 로그인하기를 기다리고 있어요</span>
</div>
<div style="width: 100%; padding: 24px 28px; box-sizing: border-box; border-radius: 28px; background: #F6F3F2; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 26px; color: #5C5955">QR이 안 찍히면 휴대폰에서 [주소]에 들어가 이 코드를 입력하세요</div>
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font-size: 52px; font-weight: 800; letter-spacing: 0.08em; font-variant-numeric: tabular-nums">7K2-9QF</div>
<div style="font-size: 26px; color: #5C5955; font-variant-numeric: tabular-nums">4:52 남음</div>
</div>
</div>
<button type="button" style="margin-top: auto; width: 100%; height: 104px; border: 0; border-radius: 32px; background: #E2DFDB; color: #1A1A1A; font-family: inherit; font-size: 34px; font-weight: 600; cursor: pointer">나중에 할게요</button>
</div>
</div>
</div>


</body>
</html>
