<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>주차 위치 묻기</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#002C5F}a:hover{color:#001E42}
button:focus-visible,a:focus-visible{outline:4px solid #002C5F;outline-offset:4px}
::selection{background:#002C5F;color:#FFFFFF}
</style>

</head>
<body>


<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 64px 96px 80px; display: flex; flex-direction: column; gap: 48px; background: #F6F3F2; color: #1A1A1A; font-family: 'Asta Sans', 'Noto Sans KR', system-ui, sans-serif; word-break: keep-all">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-size: 30px; font-weight: 700; letter-spacing: -0.01em">[앱 이름]</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 28px; border-radius: 999px; background: #FFFFFF; color: #5C5955; font-size: 28px; font-weight: 600">
<svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="M10 16V8h3a2.500 2.500 0 0 1 0 5h-3"></path></svg>
<span>주차 중 · 방금 P로 바꿨어요</span>
</div>
</div>
<div style="flex-grow: 1; min-height: 0; display: flex; gap: 72px; align-items: stretch">
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 36px">
<h1 style="margin: 0; font-size: 84px; line-height: 1.22; font-weight: 800; letter-spacing: -0.03em">주차했어요.<br>어디에 세웠나요?</h1>
<p style="margin: 0; font-size: 34px; line-height: 1.5; color: #5C5955">지하에서는 위치가 정확하지 않아서, 층과 기둥 번호를 말로 남겨 두면 좋아요.</p>
<div style="display: flex; align-items: center; gap: 32px; padding: 32px 40px; border-radius: 36px; background: #FFFFFF; border: 3px solid #002C5F">
<div style="display: flex; align-items: center; gap: 8px; height: 72px"><span style="width: 10px; height: 22px; border-radius: 5px; background: #002C5F"></span><span style="width: 10px; height: 44px; border-radius: 5px; background: #002C5F"></span><span style="width: 10px; height: 64px; border-radius: 5px; background: #002C5F"></span><span style="width: 10px; height: 36px; border-radius: 5px; background: #002C5F"></span><span style="width: 10px; height: 54px; border-radius: 5px; background: #002C5F"></span><span style="width: 10px; height: 26px; border-radius: 5px; background: #002C5F"></span><span style="width: 10px; height: 46px; border-radius: 5px; background: #002C5F"></span></div>
<div><div style="font-size: 40px; font-weight: 700">말씀해 주세요</div><div style="font-size: 28px; color: #5C5955; margin-top: 4px">예: "지하 3층 기둥 C12" · 글레오가 듣고 있어요</div></div>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px">
<button type="button" style="height: 104px; border: 0; border-radius: 30px; background: #FFFFFF; color: #1A1A1A; font-family: inherit; font-size: 40px; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums">B1</button><button type="button" style="height: 104px; border: 0; border-radius: 30px; background: #FFFFFF; color: #1A1A1A; font-family: inherit; font-size: 40px; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums">B2</button><button type="button" style="height: 104px; border: 0; border-radius: 30px; background: #002C5F; color: #FFFFFF; font-family: inherit; font-size: 40px; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums">B3</button><button type="button" style="height: 104px; border: 0; border-radius: 30px; background: #FFFFFF; color: #1A1A1A; font-family: inherit; font-size: 40px; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums">B4</button><button type="button" style="height: 104px; border: 0; border-radius: 30px; background: #FFFFFF; color: #1A1A1A; font-family: inherit; font-size: 40px; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums">지상</button>
</div>
</div>
<div style="width: 680px; flex-shrink: 0; box-sizing: border-box; padding: 44px 48px; border-radius: 44px; background: #FFFFFF; display: flex; flex-direction: column">
<h2 style="margin: 0 0 8px; font-size: 34px; font-weight: 700">이미 알고 있는 것</h2>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; "><div style="font-size: 28px; color: #5C5955; white-space: nowrap">장소</div><div style="font-size: 32px; font-weight: 700; text-align: right">[회사 건물] 주차장</div></div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; border-top: 1px solid #E2DFDB;"><div style="font-size: 28px; color: #5C5955; white-space: nowrap">주차한 시각</div><div style="font-size: 32px; font-weight: 700; text-align: right"><span style="font-variant-numeric: tabular-nums">08:47</span></div></div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; border-top: 1px solid #E2DFDB;"><div style="font-size: 28px; color: #5C5955; white-space: nowrap">지난번 여기서</div><div style="font-size: 32px; font-weight: 700; text-align: right">B3 · 기둥 C12</div></div>
<button type="button" style="margin-top: auto; height: 120px; border: 0; border-radius: 32px; background: #E2DFDB; color: #1A1A1A; font-family: inherit; font-size: 36px; font-weight: 700; cursor: pointer">지난번과 같아요</button>
<button type="button" style="margin-top: 16px; height: 96px; border: 0; border-radius: 28px; background: transparent; color: #5C5955; font-family: inherit; font-size: 30px; font-weight: 600; cursor: pointer">이번엔 건너뛰기</button>
</div>
</div>
</div>


</body>
</html>
