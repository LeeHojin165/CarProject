<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>출근 목적지 확인 팝업</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#002C5F}a:hover{color:#001E42}
button:focus-visible{outline:4px solid #002C5F;outline-offset:4px}

</style>

</head>
<body>


<div style="position: relative; width: 1920px; height: 1080px; box-sizing: border-box; padding: 64px 96px 80px; display: flex; flex-direction: column; gap: 48px; background: #F6F3F2; color: #1A1A1A; font-family: 'Asta Sans', 'Noto Sans KR', system-ui, sans-serif">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-size: 30px; font-weight: 700; letter-spacing: -0.01em">[앱 이름]</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 28px; border-radius: 999px; background: #FFFFFF; color: #5C5955; font-size: 28px; font-weight: 600">
<svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="M10 16V8h3a2.5 2.5 0 0 1 0 5h-3"></path></svg>
<span>주차 중 · 출발 전</span>
</div>
</div>
<div style="flex-grow: 1; display: flex; gap: 80px; align-items: stretch">
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 40px">
<h1 style="margin: 0; font-size: 92px; line-height: 1.22; font-weight: 800; letter-spacing: -0.03em">좋은 아침이에요.<br>출근하시나요?</h1>
<p style="margin: 0; font-size: 34px; line-height: 1.5; color: #5C5955">화요일 이 시간에는 보통 회사로 출발하셨어요.</p>
<div style="display: flex; flex-direction: column; gap: 24px; margin-top: 16px">
<button type="button" style="height: 144px; border: 0; border-radius: 36px; background: #002C5F; color: #FFFFFF; font-family: inherit; font-size: 46px; font-weight: 700; letter-spacing: -0.01em; cursor: pointer">네, 출근해요</button>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
<button type="button" style="height: 120px; border: 0; border-radius: 32px; background: #E2DFDB; color: #1A1A1A; font-family: inherit; font-size: 38px; font-weight: 600; cursor: pointer">퇴근이에요</button>
<button type="button" style="height: 120px; border: 0; border-radius: 32px; background: #E2DFDB; color: #1A1A1A; font-family: inherit; font-size: 38px; font-weight: 600; cursor: pointer">출장 가요</button>
</div>
</div>
</div>
<div style="width: 660px; flex-shrink: 0; box-sizing: border-box; padding: 44px 48px; border-radius: 44px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0 0 12px; font-size: 36px; font-weight: 700; letter-spacing: -0.01em">출발 전에 살펴봤어요</h2>
<div style="display: flex; align-items: center; gap: 24px; padding: 28px 0">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#5C5955" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="16" height="9" rx="2.5"></rect><path d="M22 11v3"></path><path d="M7 11.5v2M10.5 11.5v2"></path></svg>
<div style="flex-grow: 1; font-size: 32px; color: #5C5955">배터리</div>
<div style="font-size: 34px; font-weight: 700">62% · 280km</div>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 28px 0; border-top: 1px solid #E2DFDB">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#5C5955" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3.5"></circle></svg>
<div style="flex-grow: 1; font-size: 32px; color: #5C5955">타이어 공기압</div>
<div style="font-size: 34px; font-weight: 700">네 바퀴 정상</div>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 28px 0; border-top: 1px solid #E2DFDB">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#5C5955" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19L12 3z"></path><path d="M12 10v4.5M12 17.2v.3"></path></svg>
<div style="flex-grow: 1; font-size: 32px; color: #5C5955">경고등</div>
<div style="font-size: 34px; font-weight: 700">없음</div>
</div>
<div style="display: flex; align-items: center; gap: 24px; padding: 28px 0; border-top: 1px solid #E2DFDB">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#A36B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c3 4 5.5 7 5.5 10.5a5.5 5.5 0 0 1-11 0C6.500 10.500 9 7.500 12 3.500z"></path></svg>
<div style="flex-grow: 1; font-size: 32px; color: #5C5955">워셔액</div>
<div style="font-size: 34px; font-weight: 700; color: #A36B4F">부족 · 보충 필요</div>
</div>
<p style="margin: auto 0 0; font-size: 28px; line-height: 1.5; color: #5C5955">가는 길 주유소에서 넣을 수 있게, 출발하면 다시 알려드릴게요.</p>
</div>
</div>
<div style="position: absolute; inset: 0; background: rgba(26,26,26,.48); display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-modal="true" style="width: 1080px; box-sizing: border-box; padding: 64px 72px; border-radius: 52px; background: #FFFFFF; display: flex; flex-direction: column; gap: 36px; box-shadow: 0 24px 64px rgba(0,0,0,.22); word-break: keep-all">
<div style="font-size: 30px; font-weight: 600; color: #5C5955">출근 경로를 잡기 전에</div>
<h2 style="margin: -20px 0 0; font-size: 72px; line-height: 1.2; font-weight: 800; letter-spacing: -0.03em">오늘도 <span style="color: #002C5F">회사</span>로 가시나요?</h2>
<div style="display: flex; align-items: center; gap: 28px; padding: 32px 36px; border-radius: 32px; background: #F6F3F2">
<div style="width: 88px; height: 88px; border-radius: 26px; background: #FFFFFF; color: #002C5F; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l6-4v16M9 21h12V11l-6-3"></path><path d="M13 13h4M13 17h4"></path></svg></div>
<div style="flex-grow: 1"><div style="font-size: 40px; font-weight: 800">[회사 이름]</div><div style="font-size: 28px; color: #5C5955; margin-top: 6px">[회사 주소] · 마이페이지에 저장한 곳</div></div>
<div style="text-align: right; flex-shrink: 0"><div style="font-size: 26px; color: #5C5955">지금 출발하면</div><div style="font-size: 40px; font-weight: 800; color: #002C5F; font-variant-numeric: tabular-nums">8시 46분</div></div>
</div>
<div style="display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px">
<button type="button" style="height: 136px; border: 0; border-radius: 36px; background: #002C5F; color: #FFFFFF; font-family: inherit; font-size: 44px; font-weight: 700; cursor: pointer">네, 회사로 가요</button>
<a href="03_DestAsk.html" style="height: 136px; border-radius: 36px; background: #E2DFDB; color: #1A1A1A; font-size: 40px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">다른 곳이에요</a>
</div>
<p style="margin: 0; font-size: 28px; line-height: 1.5; color: #5C5955">퇴근이에요를 누르면 같은 방식으로 집이 맞는지 물어봐요.</p>
</div>
</div>
</div>
